services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_ORIGINS: https://ai-agent.firmspace.eu,https://www.ai-agent.firmspace.eu
      SESSION_TTL_HOURS: "12"
      COOKIE_SECURE: "true"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - infrastructure
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  infrastructure:
    external: true
